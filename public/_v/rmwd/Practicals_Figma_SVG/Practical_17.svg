<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><rect x="0" y="0" width="1280" height="800" rx="0" fill="#F3F4F6"/><rect x="0" y="0" width="1280" height="70" rx="0" fill="#fff"/><rect x="0" y="70" width="1280" height="1" rx="0" fill="#E5E7EB"/><rect x="30" y="18" width="44" height="34" rx="8" fill="#4F46E5"/><text x="52" y="41" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">17</text><text x="90" y="33" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#111827" text-anchor="start">Practical 17: Feedback &amp; Usability Testing</text><text x="90" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6B7280" text-anchor="start">Usability test of a peer prototype</text><text x="1250" y="42" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="end">Responsive Web &amp; Mobile UI Design - BETCE15324</text><text x="60" y="120" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" fill="#111827" text-anchor="start">Usability Test Report</text><text x="60" y="148" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6B7280" text-anchor="start">Prototype: ShopEasy app   |   Tester: Peer A   |   Date: 20 Oct 2026</text><rect x="60" y="175" width="1160" height="44" rx="0" fill="#4F46E5"/><text x="72" y="203" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="start">Task</text><text x="442" y="203" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="start">Done?</text><text x="612" y="203" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="start">Time</text><text x="752" y="203" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="start">Notes</text><rect x="60" y="219" width="1160" height="56" rx="0" fill="#fff" stroke="#E5E7EB" stroke-width="1"/><text x="72" y="253" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#111827" text-anchor="start">1. Find a product</text><text x="442" y="253" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#059669" text-anchor="start">Yes</text><text x="612" y="253" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#111827" text-anchor="start">12s</text><text x="752" y="253" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#111827" text-anchor="start">Easy to find</text><rect x="60" y="275" width="1160" height="56" rx="0" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/><text x="72" y="309" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#111827" text-anchor="start">2. Add to cart</text><text x="442" y="309" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#059669" text-anchor="start">Yes</text><text x="612" y="309" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#111827" text-anchor="start">8s</text><text x="752" y="309" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#111827" text-anchor="start">Button clear</text><rect x="60" y="331" width="1160" height="56" rx="0" fill="#fff" stroke="#E5E7EB" stroke-width="1"/><text x="72" y="365" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#111827" text-anchor="start">3. Change quantity</text><text x="442" y="365" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#059669" text-anchor="start">Yes</text><text x="612" y="365" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#111827" text-anchor="start">25s</text><text x="752" y="365" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#111827" text-anchor="start">Icons too small</text><rect x="60" y="387" width="1160" height="56" rx="0" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/><text x="72" y="421" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#111827" text-anchor="start">4. Apply coupon</text><text x="442" y="421" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#DC2626" text-anchor="start">No</text><text x="612" y="421" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#111827" text-anchor="start">-</text><text x="752" y="421" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#111827" text-anchor="start">Could not find field</text><rect x="60" y="443" width="1160" height="56" rx="0" fill="#fff" stroke="#E5E7EB" stroke-width="1"/><text x="72" y="477" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#111827" text-anchor="start">5. Complete checkout</text><text x="442" y="477" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#059669" text-anchor="start">Yes</text><text x="612" y="477" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#111827" text-anchor="start">40s</text><text x="752" y="477" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#111827" text-anchor="start">Too many steps</text><rect x="60" y="540" width="370" height="130" rx="12" fill="#fff" stroke="#E5E7EB" stroke-width="1"/><text x="85" y="580" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#6B7280" text-anchor="start">Success rate</text><text x="85" y="640" font-family="DejaVu Sans, Arial, sans-serif" font-size="40" font-weight="bold" fill="#059669" text-anchor="start">80%</text><rect x="450" y="540" width="370" height="130" rx="12" fill="#fff" stroke="#E5E7EB" stroke-width="1"/><text x="475" y="580" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#6B7280" text-anchor="start">Avg. time</text><text x="475" y="640" font-family="DejaVu Sans, Arial, sans-serif" font-size="40" font-weight="bold" fill="#4F46E5" text-anchor="start">21s</text><rect x="840" y="540" width="370" height="130" rx="12" fill="#fff" stroke="#E5E7EB" stroke-width="1"/><text x="865" y="580" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#6B7280" text-anchor="start">Satisfaction</text><text x="865" y="640" font-family="DejaVu Sans, Arial, sans-serif" font-size="40" font-weight="bold" fill="#D97706" text-anchor="start">4 / 5</text><text x="60" y="715" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#111827" text-anchor="start">Findings: coupon field is hidden, quantity icons are small, checkout has too many steps.</text></svg>